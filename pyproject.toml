[project]
name = "unifolm_wma"
version = "0.0.1"
description = "UnifoLM-WMA-0"
license = { text = "BSD-3-Clause" }
authors = [
    {name="Unitree Embodied AI R&D Team", email="rd_xyc@unitree.com"  }
]
requires-python = ">=3.10.18,<3.11"
dependencies = [
    "decord==0.6.0",
    "h5py==3.12.1",
    "einops==0.8.0",
    "imageio==2.35.1",
    "numpy==1.24.2",
    "omegaconf==2.3.0",
    "opencv-python-headless==4.10.0.84",
    "pandas==2.0.0",
    "pillow==9.5.0",
    "pytorch-lightning==1.9.3",
    "pyyaml==6.0",
    "torchmetrics==0.11.4",
    "setuptools==65.6.3",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "tqdm==4.66.5",
    "transformers==4.40.1",
    "moviepy==1.0.3",
    "av==12.3.0",
    "xformers==0.0.31.post1",
    "tensorboard==2.19.0",
    "matplotlib==3.9.4",
    "fastapi==0.115.14",
    "uvicorn==0.34.3",
    "timm==0.9.10",
    "scikit-learn==1.5.1",
    "open-clip-torch==2.22.0",
    "kornia==0.7.3",
    "diffusers==0.30.2",
    "termcolor==2.4.0",
    "draccus==0.11.5",
    "accelerate==1.7.0",
    "huggingface-hub<1",
    "datasets==3.6.0",
    "fairscale==0.4.13"
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
xformers = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=65.6.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src"  }

[tool.setuptools.packages.find]
where = ["src"]
